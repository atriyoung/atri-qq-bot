version: "3.8"

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: qq-napcat
    environment:
      - ACCOUNT=${QQ_ACCOUNT:?必须设置 QQ 账号}
      - WS_ENABLE=true
      - WS_URL=ws://bot:8765/onebot/v11/ws
      - WEBUI_TOKEN=${NAPACAT_TOKEN:-napcat}
    ports:
      - "6099:6099"          # NapCat WebUI
    volumes:
      - ./napcat_data:/app/.config/QQ
      - ./napcat_cache:/app/.config/napcat
    restart: unless-stopped
    depends_on:
      - bot

  bot:
    build: .
    container_name: qq-ai-girlfriend
    environment:
      - TZ=Asia/Shanghai
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    ports:
      - "8765:8765"
    restart: unless-stopped
